<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--g:#22A06B;--gd:#1A8457;--ink:#111827;--mute:#6B7280;--bg:#F5F6F8;--line:#E5E7EB}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1440px;height:900px;overflow:hidden;font-family:'Be Vietnam Pro',sans-serif;background:var(--bg);color:var(--ink)}
header{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 40px;gap:36px}
header b{font-size:22px;font-weight:800;color:var(--g)}
header nav{display:flex;gap:4px}
header a{font-size:15px;color:var(--mute);padding:9px 14px;border-radius:10px}
header a.on{background:#E8F6EF;color:var(--gd);font-weight:600}
header .u{margin-left:auto;font-size:14px;font-weight:600}
.wrap{padding:32px 40px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px}
.c{background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px}
.hero{grid-column:1/3;display:flex;gap:32px;align-items:center}
.ring{width:180px;height:180px;border-radius:50%;background:conic-gradient(var(--g) 0 40%,#E5E7EB 40% 100%);display:grid;place-items:center}
.ring div{width:144px;height:144px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center;font-size:14px;color:var(--mute)}
.ring b{display:block;font-size:34px;color:var(--ink)}
h1{font-size:30px;font-weight:700}
p{color:var(--mute);font-size:16px;margin-top:6px}
.btn{display:inline-flex;height:54px;align-items:center;padding:0 32px;border-radius:14px;background:var(--gd);color:#fff;font-weight:700;font-size:17px;margin-top:20px;box-shadow:0 4px 0 #136843}
.lbl{font-size:13px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.st{font-size:56px;font-weight:800;margin-top:6px}
.list{grid-column:1/4;display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.list div{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px}
.list i{display:block;width:44px;height:44px;border-radius:12px;background:#E8F6EF;margin-bottom:14px}
.list b{font-size:16px}
.list span{display:block;font-size:14px;color:var(--mute);margin-top:4px}
.bar{height:8px;background:var(--line);border-radius:4px;margin-top:12px}
.bar u{display:block;height:8px;width:60%;background:var(--g);border-radius:4px}
</style></head><body>
<header><b>EngEasy</b><nav><a class="on">Hôm nay</a><a>Buổi học</a><a>Thẻ ôn</a><a>Mẫu câu</a><a>Luyện nói</a></nav><div class="u">🔥 6 ngày</div></header>
<div class="wrap">
  <div class="c hero"><div class="ring"><div><span><b>6/15</b>phút hôm nay</span></div></div><div><h1>Chào Minh Anh!</h1><p>Bạn có 24 thẻ cần ôn hôm nay · khoảng 8 phút</p><a class="btn">Ôn ngay</a></div></div>
  <div class="c"><div class="lbl">Chuỗi ngày</div><div class="st">6</div><p>Kỷ lục: 11 ngày</p></div>
  <div class="list">
    <div><i></i><b>Buổi 12 · Ordering food</b><span>18 mục · 7/11</span><div class="bar"><u></u></div></div>
    <div><i></i><b>Buổi 11 · Directions</b><span>14 mục · 5/11</span><div class="bar"><u></u></div></div>
    <div><i></i><b>Shadowing</b><span>5 câu hôm nay</span><div class="bar"><u></u></div></div>
    <div><i></i><b>Mẫu câu tình huống</b><span>9 chủ đề</span><div class="bar"><u></u></div></div>
  </div>
</div>
</body></html>
